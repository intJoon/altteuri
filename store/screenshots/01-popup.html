<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Store screenshot — popup</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1280px; height: 800px; overflow: hidden; font-family: -apple-system, "Malgun Gothic", sans-serif; }
      body {
        background: linear-gradient(145deg, #eef3ff 0%, #f7f9ff 45%, #fff 100%);
        display: flex; align-items: center; justify-content: center; gap: 48px;
      }
      .frame {
        width: 380px; background: #fff; border-radius: 16px;
        box-shadow: 0 24px 60px rgba(36, 79, 196, 0.15);
        padding: 16px 18px 20px; border: 1px solid #e8ecf4;
      }
      .title-bar { display: flex; justify-content: space-between; margin-bottom: 12px; }
      .title { font-size: 16px; font-weight: 700; color: #212b36; }
      .link { font-size: 12px; color: #8c8c8c; }
      .onboard {
        background: #edf2ff; border: 1px solid #c9d8ff; border-radius: 10px;
        padding: 12px 14px; margin-bottom: 14px; font-size: 13px; line-height: 1.5; color: #244fc4;
      }
      .sec { font-size: 12px; color: #8c8c8c; margin: 14px 0 6px; }
      .row {
        display: flex; justify-content: space-between; align-items: center;
        min-height: 42px; border-bottom: 1px solid #f0f0f0; font-size: 14px; color: #333;
      }
      .sw {
        width: 44px; height: 24px; border-radius: 12px; background: #d2d5da; position: relative;
      }
      .sw i { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
      .copy { max-width: 420px; }
      .copy h1 { font-size: 42px; letter-spacing: -0.03em; color: #1a2433; line-height: 1.2; margin-bottom: 16px; }
      .copy p { font-size: 20px; color: #454b53; line-height: 1.6; }
      .badge {
        display: inline-block; margin-top: 20px; padding: 10px 18px; border-radius: 999px;
        background: #346aff; color: #fff; font-size: 14px; font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <h1>원하는 기능만<br />켜세요</h1>
      <p>설치만으로 쿠팡 페이지가 바뀌지 않습니다. 정렬·필터·표시 항목을 팝업에서 선택합니다.</p>
      <span class="badge">모든 기능 opt-in</span>
    </div>
    <div class="frame">
      <div class="title-bar"><span class="title">알뜰이</span><span class="link">의견 보내기</span></div>
      <div class="onboard">기능이 모두 꺼져 있습니다. <strong>단위가격순</strong>부터 켜 보세요.</div>
      <div class="sec">정렬</div>
      <div class="row"><span>단위가격순</span><div class="sw"><i></i></div></div>
      <div class="row"><span>할인율순</span><div class="sw"><i></i></div></div>
      <div class="row"><span>가격순</span><div class="sw"><i></i></div></div>
      <div class="sec">필터</div>
      <div class="row"><span>키워드 필터링</span><div class="sw"><i></i></div></div>
    </div>
  </body>
</html>
