<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #eef3ff;
        --ink: #1a2433;
        --text: #3a4452;
        --muted: #545e6d;
        --line: #d7e0f2;
        --surface: #ffffff;
        --blue: #2f5ff0;
        --blue-soft: #dce6ff;
        --blue-dark: #244fc4;
        --success: #16803c;
        --danger: #b42318;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
      }
      body { font-family: "IBM Plex Sans KR", sans-serif; color: var(--ink); }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
      }
      .bg-layer {
        position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(ellipse 90% 55% at 50% -5%, #c9d8ff 0%, transparent 58%),
          radial-gradient(ellipse 70% 40% at 100% 70%, #d7e4ff 0%, transparent 50%),
          radial-gradient(ellipse 55% 35% at 0% 85%, #dce8ff 0%, transparent 48%),
          linear-gradient(180deg, #f4f7ff 0%, #e8efff 100%);
      }
      .orb { position: absolute; border-radius: 50%; filter: blur(2px); opacity: 0.55; }
      .orb-a {
        width: 420px; height: 420px; top: 180px; left: -120px;
        background: radial-gradient(circle, #9bb6ff 0%, transparent 70%);
      }
      .orb-b {
        width: 360px; height: 360px; bottom: 240px; right: -80px;
        background: radial-gradient(circle, #b8cbff 0%, transparent 70%);
      }
      .ghost-word {
        position: absolute; font-family: Outfit, "IBM Plex Sans KR", sans-serif;
        font-weight: 800; font-size: 180px; letter-spacing: -0.04em;
        color: #346aff; opacity: 0.05; white-space: nowrap; pointer-events: none;
      }
      .ghost-word.top { top: 120px; left: 40px; }
      .ghost-word.bottom { bottom: 160px; right: 20px; font-size: 140px; }
      .progress {
        position: absolute; left: 72px; right: 72px; top: 56px; height: 6px;
        border-radius: 999px; background: rgba(47, 95, 240, 0.15); z-index: 25; overflow: hidden;
      }
      .progress > i { display: block; height: 100%; width: 0%; background: var(--blue); border-radius: 999px; }
      .scene {
        position: absolute; inset: 0; padding: 120px 72px 140px;
        display: flex; flex-direction: column;
      }
      .scene-inner { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      .eyebrow {
        font-size: 28px; font-weight: 600; color: var(--blue);
        letter-spacing: 0.04em; margin-bottom: 28px;
      }
      .headline {
        font-family: Outfit, "IBM Plex Sans KR", sans-serif;
        font-size: 78px; font-weight: 800; line-height: 1.18;
        letter-spacing: -0.03em; color: var(--ink);
      }
      .headline.sm { font-size: 58px; }
      .headline .mark { color: var(--blue); }
      .sub {
        margin-top: 28px; font-size: 34px; font-weight: 500;
        line-height: 1.45; color: var(--text); max-width: 880px;
      }
      .caption-bar {
        position: absolute; left: 72px; right: 72px; bottom: 120px; z-index: 20;
        min-height: 72px; display: flex; align-items: center; justify-content: center;
        text-align: center; font-size: 30px; font-weight: 600; color: var(--ink);
        background: rgba(255, 255, 255, 0.88); border: 1.5px solid var(--line);
        border-radius: 20px; padding: 18px 28px;
        box-shadow: 0 12px 40px rgba(36, 79, 196, 0.08); opacity: 0;
      }
      .cap-line { position: absolute; left: 28px; right: 28px; opacity: 0; }
      .brand-wrap, .cta-wrap {
        flex: 1; display: flex; flex-direction: column; align-items: center;
        justify-content: center; text-align: center; gap: 28px;
      }
      .brand-icon {
        width: 168px; height: 168px; border-radius: 40px;
        box-shadow: 0 24px 60px rgba(47, 95, 240, 0.28);
      }
      .brand-name {
        font-family: Outfit, "IBM Plex Sans KR", sans-serif;
        font-size: 108px; font-weight: 800; letter-spacing: -0.04em; line-height: 1;
      }
      .brand-tag { font-size: 34px; font-weight: 500; color: var(--text); }
      .pill {
        display: inline-flex; align-items: center; gap: 10px; margin-top: 8px;
        padding: 14px 26px; border-radius: 999px; background: var(--blue-soft);
        color: var(--blue-dark); font-size: 26px; font-weight: 600;
      }
      .popup {
        width: 100%; max-width: 780px; margin: 40px auto 0; background: var(--surface);
        border-radius: 28px; border: 1.5px solid var(--line);
        box-shadow: 0 28px 70px rgba(26, 36, 51, 0.12); padding: 36px 40px 28px;
      }
      .popup-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
      .popup-title strong { font-size: 32px; font-weight: 700; }
      .popup-title span { font-size: 22px; color: var(--muted); }
      .popup-section { font-size: 22px; color: var(--muted); margin: 22px 0 8px; }
      .popup-row {
        display: flex; align-items: center; justify-content: space-between;
        min-height: 72px; border-bottom: 1px solid #f0f0f0; font-size: 28px; font-weight: 500;
      }
      .popup-row:last-child { border-bottom: none; }
      .switch {
        width: 40px; height: 22px; border-radius: 11px; background: #d2d5da;
        position: relative; flex: none; overflow: hidden;
      }
      .switch .knob {
        position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
        border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .cursor {
        position: absolute; width: 48px; height: 48px; z-index: 30;
        pointer-events: none; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.25)); opacity: 0;
      }
      .panel {
        margin-top: 36px; background: var(--surface); border-radius: 28px;
        border: 1.5px solid var(--line); box-shadow: 0 28px 70px rgba(26, 36, 51, 0.1);
        padding: 28px; overflow: hidden;
      }
      .sortbar {
        display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 22px;
        font-size: 24px; color: var(--muted);
      }
      .sortbar span { position: relative; }
      .sort-line {
        position: absolute; left: 0; right: 0; bottom: -8px; height: 3px;
        background: var(--blue); border-radius: 2px; transform-origin: left center; transform: scaleX(0);
      }
      .item {
        display: grid; grid-template-columns: 88px 1fr auto; gap: 18px; align-items: center;
        padding: 18px 12px; border-radius: 18px; background: #f8faff; margin-bottom: 14px; position: relative;
      }
      .item:last-child { margin-bottom: 0; }
      .thumb {
        width: 88px; height: 88px; border-radius: 16px;
        background: linear-gradient(145deg, #d9e4ff, #c5d4f8); position: relative;
      }
      .rank {
        position: absolute; top: 8px; left: 8px; width: 28px; height: 28px; border-radius: 8px;
        background: var(--blue); color: #fff; font-size: 16px; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
      }
      .rank-alt { opacity: 0; }
      .item-title { font-size: 26px; font-weight: 600; line-height: 1.3; }
      .item-meta { margin-top: 6px; font-size: 22px; color: var(--muted); }
      .item-price { font-size: 28px; font-weight: 700; color: var(--ink); white-space: nowrap; }
      .item-unit { margin-top: 4px; font-size: 20px; color: var(--blue-dark); font-weight: 600; text-align: right; }
      .kw-row { display: flex; gap: 14px; margin-bottom: 20px; align-items: center; }
      .kw-input {
        flex: 1; height: 64px; border-radius: 16px; border: 1.5px solid var(--line);
        background: #f8faff; display: flex; align-items: center; padding: 0 22px;
        font-size: 26px; color: var(--ink);
      }
      .kw-input span { opacity: 0; }
      .kw-add {
        height: 64px; padding: 0 28px; border-radius: 16px; background: var(--blue);
        color: #fff; font-size: 26px; font-weight: 700; display: flex; align-items: center;
      }
      .tag {
        display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px;
        border-radius: 999px; background: var(--blue-soft); color: var(--blue-dark);
        font-size: 22px; font-weight: 600; margin-bottom: 18px; opacity: 0;
      }
      .hit { color: var(--danger); font-style: normal; font-weight: 700; }
      .cta-icon {
        width: 120px; height: 120px; border-radius: 32px;
        box-shadow: 0 20px 50px rgba(47, 95, 240, 0.25);
        object-fit: cover;
      }
      .cta-title {
        font-family: Outfit, "IBM Plex Sans KR", sans-serif;
        font-size: 72px; font-weight: 800; letter-spacing: -0.03em;
      }
      .cta-sub { font-size: 32px; color: var(--text); font-weight: 500; }
      .cta-btn {
        margin-top: 12px; padding: 26px 48px; border-radius: 999px; background: var(--blue);
        color: #fff; font-size: 32px; font-weight: 700;
        box-shadow: 0 16px 40px rgba(47, 95, 240, 0.35);
      }
      .cta-url { font-size: 28px; color: var(--blue-dark); font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="29" data-width="1080" data-height="1920">
      <div id="bg-layer" class="bg-layer" data-layout-allow-overflow data-track-index="0">
        <div class="orb orb-a" id="orb-a"></div>
        <div class="orb orb-b" id="orb-b"></div>
        <div class="ghost-word top" id="ghost-a">알뜰</div>
        <div class="ghost-word bottom" id="ghost-b">SHOP</div>
      </div>
      <div class="progress"><i id="progress-fill"></i></div>

      <div id="scene-hook" class="clip" data-composition-id="scene-hook" data-composition-src="compositions/scene-hook.html" data-start="0" data-duration="3.2" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="scene-brand" class="clip" data-composition-id="scene-brand" data-composition-src="compositions/scene-brand.html" data-start="3.2" data-duration="3.6" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="scene-toggle" class="clip" data-composition-id="scene-toggle" data-composition-src="compositions/scene-toggle.html" data-start="6.8" data-duration="5.4" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="scene-sort" class="clip" data-composition-id="scene-sort" data-composition-src="compositions/scene-sort.html" data-start="12.2" data-duration="5.6" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="scene-filter" class="clip" data-composition-id="scene-filter" data-composition-src="compositions/scene-filter.html" data-start="17.8" data-duration="5.6" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="scene-cta" class="clip" data-composition-id="scene-cta" data-composition-src="compositions/scene-cta.html" data-start="23.4" data-duration="5.6" data-track-index="1" data-width="1080" data-height="1920"></div>

      <div class="caption-bar clip" id="caption" data-start="0" data-duration="29" data-track-index="2">
        <span class="cap-line" id="cap-0">쿠팡 검색, 아직도 하나씩 비교하세요?</span>
        <span class="cap-line" id="cap-1">알뜰이 · 쿠팡용 Chrome 확장</span>
        <span class="cap-line" id="cap-2">팝업에서 원하는 기능만 켜기</span>
        <span class="cap-line" id="cap-3">단위가격순으로 한 번에 정렬</span>
        <span class="cap-line" id="cap-4">키워드로 불필요한 결과 숨기기</span>
        <span class="cap-line" id="cap-5">무료 · GitHub에서 설치하세요</span>
      </div>

      <audio class="clip" id="sfx-toggle-a" data-start="8.45" data-duration="0.07" data-track-index="3" src="assets/sfx/toggle.wav"></audio>
      <audio class="clip" id="sfx-toggle-b" data-start="9.2" data-duration="0.07" data-track-index="3" src="assets/sfx/toggle.wav"></audio>
      <audio class="clip" id="sfx-sort" data-start="14.1" data-duration="0.09" data-track-index="3" src="assets/sfx/sort.wav"></audio>
      <audio class="clip" id="sfx-hide" data-start="20.0" data-duration="0.18" data-track-index="3" src="assets/sfx/hide.wav"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#orb-a", { scale: 0.92, x: 0 }, { scale: 1.08, x: 40, duration: 29, ease: "none" }, 0);
      tl.fromTo("#orb-b", { scale: 1.05, y: 0 }, { scale: 0.9, y: -50, duration: 29, ease: "none" }, 0);
      tl.fromTo("#ghost-a", { x: 0 }, { x: 60, duration: 29, ease: "none" }, 0);
      tl.fromTo("#ghost-b", { x: 0 }, { x: -80, duration: 29, ease: "none" }, 0);
      tl.fromTo("#progress-fill", { width: "0%" }, { width: "100%", duration: 29, ease: "none" }, 0);

      const captionBeats = [
        { id: "cap-0", t: 0.15, until: 3.2 },
        { id: "cap-1", t: 3.2, until: 6.8 },
        { id: "cap-2", t: 6.8, until: 12.2 },
        { id: "cap-3", t: 12.2, until: 17.8 },
        { id: "cap-4", t: 17.8, until: 23.4 },
        { id: "cap-5", t: 23.4, until: 29 },
      ];
      captionBeats.forEach(({ id, t, until }) => {
        tl.set(`#${id}`, { opacity: 0 }, 0);
        tl.fromTo(`#${id}`, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, t);
        if (until < 29) tl.to(`#${id}`, { opacity: 0, duration: 0.2, ease: "power1.in" }, until - 0.15);
      });
      tl.set("#caption", { opacity: 1 }, 0.1);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
