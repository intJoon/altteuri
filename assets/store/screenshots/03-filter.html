<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Store screenshot — filter</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1280px; height: 800px; overflow: hidden; font-family: -apple-system, "Malgun Gothic", sans-serif; background: #f7f8fa; }
      .wrap { padding: 48px 56px; }
      h1 { font-size: 36px; color: #212b36; margin-bottom: 8px; }
      .sub { color: #68717c; font-size: 18px; margin-bottom: 28px; }
      .panel { background: #fff; border-radius: 16px; border: 1px solid #f0f0f0; padding: 24px; max-width: 900px; }
      .kw { display: flex; gap: 12px; margin-bottom: 16px; }
      .input { flex: 1; height: 48px; border: 1px solid #ddd; border-radius: 8px; padding: 0 16px; color: #888; display: flex; align-items: center; }
      .add { height: 48px; padding: 0 20px; border-radius: 8px; background: #f5f5f5; border: 1px solid #ddd; display: flex; align-items: center; font-weight: 600; }
      .tag { display: inline-flex; padding: 8px 14px; border-radius: 999px; background: #edf2ff; color: #2a58d6; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
      .item { display: grid; grid-template-columns: 72px 1fr auto; gap: 16px; padding: 14px; background: #f8faff; border-radius: 12px; margin-bottom: 12px; align-items: center; }
      .thumb { width: 72px; height: 72px; border-radius: 12px; background: #e8ecf4; }
      .name { font-size: 17px; font-weight: 600; }
      .out { opacity: 0.35; text-decoration: line-through; }
      .hit { color: #b42318; font-style: normal; }
      .price { font-size: 18px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>키워드 필터</h1>
      <p class="sub">제외 키워드가 포함된 상품을 숨깁니다.</p>
      <div class="panel">
        <div class="kw"><div class="input">제외할 키워드 입력</div><div class="add">추가</div></div>
        <div class="tag">키캡 ✕</div>
        <div class="item">
          <div class="thumb"></div>
          <div class="name">기계식 키보드 텐키리스</div>
          <div class="price">49,800원</div>
        </div>
        <div class="item out">
          <div class="thumb"></div>
          <div class="name"><em class="hit">키캡</em> 세트 PBT</div>
          <div class="price">18,900원</div>
        </div>
        <div class="item">
          <div class="thumb"></div>
          <div class="name">무선 키보드 저소음</div>
          <div class="price">32,400원</div>
        </div>
      </div>
    </div>
  </body>
</html>
