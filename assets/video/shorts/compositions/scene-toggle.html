<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <div data-composition-id="scene-toggle" data-duration="5.4" data-width="1080" data-height="1920" class="scene">
        <div class="scene-inner" id="tog-inner">
          <p class="eyebrow" id="tog-eye">조작 01</p>
          <h2 class="headline sm" id="tog-head">원하는 기능만<br /><span class="mark">켜세요</span></h2>
          <div class="popup" id="tog-popup">
            <div class="popup-title"><strong>알뜰이</strong><span>설정</span></div>
            <div class="popup-section">정렬</div>
            <div class="popup-row"><span>단위가격순</span><div class="switch" id="sw-sort"><div class="knob" id="kn-sort"></div></div></div>
            <div class="popup-row"><span>할인율순</span><div class="switch" id="sw-disc"><div class="knob" id="kn-disc"></div></div></div>
            <div class="popup-section">필터</div>
            <div class="popup-row"><span>키워드 필터링</span><div class="switch" id="sw-filter"><div class="knob" id="kn-filter"></div></div></div>
          </div>
          <svg class="cursor" id="cursor-tog" viewBox="0 0 24 24"><path d="M5.2 2.8l13.1 7.8-5.8 1.3-2.6 5.4z" fill="#1f2937" stroke="#fff" stroke-width="1.3"/></svg>
        </div>
      </div>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.set("#tog-inner", { opacity: 1 }, 0);
        tl.from("#tog-eye", { opacity: 0, y: 20, duration: 0.35 }, 0.05);
        tl.from("#tog-head", { opacity: 0, y: 36, duration: 0.5, ease: "power3.out" }, 0.2);
        tl.from("#tog-popup", { opacity: 0, y: 50, duration: 0.55, ease: "power3.out" }, 0.45);
        tl.set("#cursor-tog", { opacity: 1, x: 620, y: 780 }, 1.1);
        tl.to("#cursor-tog", { x: 780, y: 920, duration: 0.45, ease: "power2.inOut" }, 1.15);
        tl.to("#cursor-tog", { scale: 0.85, duration: 0.1, overwrite: "auto" }, 1.6);
        tl.to("#cursor-tog", { scale: 1, duration: 0.1, overwrite: "auto" }, 1.7);
        tl.to("#sw-sort", { backgroundColor: "#2f5ff0", duration: 0.2 }, 1.7);
        tl.to("#kn-sort", { x: 18, duration: 0.2 }, 1.7);
        tl.to("#cursor-tog", { y: 992, duration: 0.35, ease: "power2.inOut" }, 1.95);
        tl.to("#cursor-tog", { scale: 0.85, duration: 0.1, overwrite: "auto" }, 2.35);
        tl.to("#cursor-tog", { scale: 1, duration: 0.1, overwrite: "auto" }, 2.45);
        tl.to("#sw-filter", { backgroundColor: "#2f5ff0", duration: 0.2 }, 2.45);
        tl.to("#kn-filter", { x: 18, duration: 0.2 }, 2.45);
        tl.to("#cursor-tog", { opacity: 0, duration: 0.25 }, 2.8);
        tl.to("#tog-inner", { opacity: 0, x: -40, duration: 0.35, ease: "power2.in" }, 5.05);
        tl.set("#tog-inner", { opacity: 0 }, 5.4);
        window.__timelines["scene-toggle"] = tl;
      </script>
    </template>
  </body>
</html>
